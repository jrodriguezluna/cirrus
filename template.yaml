AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cirrus - secretos de un solo uso con ciclo de vida

Parameters:
  SenderEmail:
    Type: String
    Description: Correo verificado en SES que envia los avisos
  ReminderWaitSeconds:
    Type: Number
    Default: 86400
    Description: Segundos entre recordatorios (86400 = 24 h; usar 30 para el demo)
  SiteUrl:
    Type: String
    Default: ''
    Description: URL de CloudFront (https://xxxx.cloudfront.net) para los links de los emails

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE: !Ref Table

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  CreateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/create/
      Handler: index.handler
      Environment:
        Variables:
          STATE_MACHINE: !Ref Lifecycle
          REMINDER_WAIT: !Ref ReminderWaitSeconds
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt Lifecycle.Name }
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/secrets }

  RevealFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/reveal/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: states:SendTaskSuccess
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: '/api/secrets/{id}/reveal' }
        Info:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/secrets/{id}/info' }

  AckFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ack/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /api/ack }

  StatusFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/status/
      Handler: index.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: '/api/secrets/{id}/status' }

  LifecycleFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/lifecycle/
      Handler: index.handler
      Timeout: 15
      Environment:
        Variables:
          SENDER: !Ref SenderEmail
          SITE_URL: !Ref SiteUrl
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: states:SendTaskSuccess
              Resource: '*'
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
              Condition:
                StringEquals:
                  'ses:FromAddress': !Ref SenderEmail

  Lifecycle:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/lifecycle.asl.json
      DefinitionSubstitutions:
        LifecycleFnArn: !GetAtt LifecycleFn.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref LifecycleFn }

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt WebOAC.Id
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  LifecycleArn:
    Value: !Ref Lifecycle
  SiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  BucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
